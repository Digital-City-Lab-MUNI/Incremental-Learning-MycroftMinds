_comment:
- Experiment matrix for rerunning the FastODT / IncubationBoost evaluations after the
- behavioral fixes (see Incremental-Learning-MycroftMinds/TODO.md, Phase 5). Transcribed
- from notebooks/{first_batch,second_batch}/*_evaluation.ipynb in that repository.
- '''$use_residuals'' in params is replaced by the dataset''s use_residuals flag.'
# Matched implementation comparison, not a separately tuned xFastODT model.
matched_models:
  xFastODT: FastODT
  xFastODT_C: FastODT
# Size/depth ablation: inherit each baseline's other per-dataset parameters.
model_variants:
  ARF_FastODT_10x10:
    source: ARF_FastODT
    params: {n_models: 10, max_depth: 10}
  ARF_Hoeffding_10x10:
    source: ARF_Hoeffding
    params: {n_models: 10, max_depth: 10}
protocol:
  seed: 42
  forecast_horizon: 1h
  agg_level: hourly
  update_freq_batch: 14D
  normalize_robust: true
  predict_train_test: false
datasets:
  fb_1h:
    data_dir: first_batch
    prefix: dev_4_1h_wfv
    data_freq: H
    use_residuals: true
    spike_prominence: 10
    update_freq_incremental: 1h
    features:
    - time
    - device_id
    - hour
    - weekday
    - month
    - L1_act_power_lag_1h
    - L1_act_power_lag_24h
    - L1_app_power_lag_1h
    - L1_app_power_lag_24h
    - L1_current_lag_1h
    - L1_current_lag_24h
    - L1_react_power_lag_1h
    - L1_react_power_lag_24h
    - L1_voltage_lag_1h
    - L1_voltage_lag_24h
    - L2_act_power_lag_1h
    - L2_act_power_lag_24h
    - L2_app_power_lag_1h
    - L2_app_power_lag_24h
    - L2_current_lag_1h
    - L2_current_lag_24h
    - L2_react_power_lag_1h
    - L2_react_power_lag_24h
    - L2_voltage_lag_1h
    - L2_voltage_lag_24h
    - L3_act_power_lag_1h
    - L3_act_power_lag_24h
    - L3_app_power_lag_1h
    - L3_app_power_lag_24h
    - L3_current_lag_1h
    - L3_current_lag_24h
    - L3_react_power_lag_1h
    - L3_react_power_lag_24h
    - L3_voltage_lag_1h
    - L3_voltage_lag_24h
    - grid_freq_lag_1h
    - grid_freq_lag_24h
    - powerfactor1_lag_1h
    - powerfactor1_lag_24h
    - powerfactor2_lag_1h
    - powerfactor2_lag_24h
    - powerfactor3_lag_1h
    - powerfactor3_lag_24h
    models:
    - BL_Prev
    - BL_Mean
    - GBDT
    - RF
    - HoeffdingTree
    - ARF_Hoeffding
    - FastODT
    - xFastODT
    - ARF_FastODT
    - IncubationBoost
    model_params:
      BL_Prev:
        is_residual: $use_residuals
      BL_Mean: {}
      GBDT:
        n_estimators: 100
        learning_rate: 0.03
        subsample: 0.8
        max_depth: 10
        random_state: 42
      RF:
        n_estimators: 100
        max_depth: 10
        max_features: sqrt
        random_state: 42
        n_jobs: -1
      HoeffdingTree:
        max_depth: 10
        grace_period: 10
        delta: 0.5
        tau: 0.05
        leaf_prediction: mean
      ARF_Hoeffding:
        n_models: 10
        max_features: 0.8
        aggregation_method: median
        grace_period: 10
        max_depth: 10
        delta: 0.5
        tau: 0.01
        seed: 42
      FastODT:
        depth: 50
        grace_period: 24
        grace_period_depth: 0
        split_confidence: 0.005
        max_feature: 0.3
        tie_threshold: 0.05
        bin_type: mean
        split_criterion: vr_rel
      xFastODT:
        depth: 50
        grace_period: 12
        grace_period_depth: 0
        split_confidence: 0.005
        max_feature: 1.0
        tie_threshold: 0.05
        bin_type: mean
        split_criterion: vr_rel
      ARF_FastODT:
        n_models: 20
        aggregation_method: mean
        grace_period: 0
        disable_weighted_vote: true
        max_depth: 50
        delta: 0.05
        tau: 0.01
        seed: 42
        max_features: 0.7
        bin_type: mean
        max_bins: 1
        split_criterion: vr_rel
      IncubationBoost:
        length: 20
        learning_rate: 0.5
        depth: 50
        grace_period: 24
        split_confidence: 0.01
        eagerness: 0
        grace_period_depth: -1
        bin_type: mean
        max_bins: 1
        max_feature: 0.7
        tie_threshold: 0.05
        split_criterion: vr_rel
        verbose: false
  fb_15m:
