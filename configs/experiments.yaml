      GBDT:
        n_estimators: 100
        learning_rate: 0.05
        max_depth: 3
        subsample: 0.6
        random_state: 42
      RF:
        n_estimators: 300
        max_depth: 7
        max_features: 1.0
        random_state: 42
        n_jobs: -1
      HoeffdingTree:
        max_depth: 10
        grace_period: 96
        tau: 0.001
        delta: 0.005
      ARF_Hoeffding:
        n_models: 10
        max_features: 0.8
        aggregation_method: median
        grace_period: 10
        max_depth: 10
        delta: 0.5
        tau: 0.01
        seed: 42
      FastODT:
        depth: 30
        grace_period: 96
        grace_period_depth: 0
        split_confidence: 0.1
        max_feature: 0.7
        tie_threshold: 0.05
        bin_type: adaptive
        max_bins: 16
        split_criterion: vr_rel
      xFastODT:
        depth: 50
        grace_period: 24
        grace_period_depth: 0
        split_confidence: 0.005
        max_feature: 0.3
        tie_threshold: 0.05
        bin_type: mean
        split_criterion: vr_rel
      ARF_FastODT:
        n_models: 5
        max_features: 0.5
        max_depth: 30
        aggregation_method: mean
        disable_weighted_vote: true
        eagerness: 0
        tau: 0.05
        delta: 0.05
        grace_period: 96
        grace_period_depth: 0
        bin_type: mean
        split_criterion: vr_rel
      IncubationBoost:
        length: 40
        learning_rate: 0.5
        depth: 10
        grace_period: 0
        grace_period_depth: 1
        split_confidence: 0.05
        max_feature: 1.0
        tie_threshold: 0.01
        bin_type: adaptive
        max_bins: 16
        split_criterion: vr_rel
        verbose: false
      IncubationBoost_WR:
        length: 30
        learning_rate: 0.01
        depth: 30
        grace_period: 24
        grace_period_depth: -1
        split_confidence: 0.1
        max_feature: 1
        tie_threshold: 0.05
        bin_type: adaptive
        max_bins: 32
        split_criterion: vr_rel
        verbose: false
        pruning_strategy: weighted_ratio
        wr_fixed_multiplier: 0.5
        wr_alpha: 1
        wr_beta: 0.1
        wr_gamma: 0.0
        wr_baseline: 0.0
        wr_min_keep: 1
        wr_error_agg:
        - ema
        wr_ema_decay: 0.95
        wr_gate_eps: 0.05
        wr_cooldown: 32
      IncubationBoost_Elastic:
        length: 50
        learning_rate: 0.001
        depth: 5
        grace_period: 48
        grace_period_depth: -1
        split_confidence: 0.1
        max_feature: 0.5
        tie_threshold: 0.05
        bin_type: adaptive
        max_bins: 32
        split_criterion: vr_rel
        verbose: false
        pruning_strategy: new_egbdt
        wr_fixed_multiplier: 2.0
        wr_alpha: 0
        wr_beta: 0
        wr_gamma: 0
        wr_baseline: 0.0
        wr_min_keep: 3
        wr_error_agg: ema
        wr_ema_decay: 0
        wr_gate_eps: 0
        wr_cooldown: 0
